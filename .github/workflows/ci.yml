name: Continuous integration
on: [push, pull_request, merge_group]

env:
  RUSTFLAGS: "-Dwarnings"
  RUSTDOCFLAGS: "-Dwarnings"
  PKG_CONFIG_i686-unknown-linux-gnu: /usr/bin/i686-linux-gnu-pkgconf

permissions:
  contents: read

jobs:
  # This allows us to have one branch protection rule for the full test matrix.
  # See: https://github.com/orgs/community/discussions/4324
  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: [test-matrix, test-schema]
    if: always()
    steps:
      - name: Tests successful
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Tests failing
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

  test-schema:
    name: Test schema
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          sparse-checkout: |
            schema
            tests/packages
            tools/schema-helper
          sparse-checkout-cone-mode: true
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            data:
              - 'schema/typst.schema.json'
              - 'tests/packages/**/typst.toml'
              - 'tools/schema-helper/**'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: steps.changes.outputs.data == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: tools/schema-helper/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        if: steps.changes.outputs.data == 'true'
        with:
          cache: 'npm'
          cache-dependency-path: tools/schema-helper/package-lock.json
      - name: Install Ajv CLI
        if: steps.changes.outputs.data == 'true'
        working-directory: tools/schema-helper
        run: |
          npm ci
          echo "$GITHUB_WORKSPACE/tools/schema-helper/node_modules/.bin" >> $GITHUB_PATH
      - name: Install check-jsonschema
        if: steps.changes.outputs.data == 'true'
        working-directory: tools/schema-helper
        run: |
          uv sync --frozen --no-install-project --no-managed-python
          echo "$GITHUB_WORKSPACE/tools/schema-helper/.venv/bin" >> $GITHUB_PATH
      - name: Validate schema compliance
        if: steps.changes.outputs.data == 'true'
        working-directory: schema/
        run: ajv compile --spec=draft7 --strict=true -c ajv-formats -s typst.schema.json
      - name: Validate manifests schema compliance
        if: steps.changes.outputs.data == 'true'
        run: |
          find tests/packages \
            -type f \
            -name typst.toml \
            -exec check-jsonschema --verbose \
              --schemafile schema/typst.schema.json \
              {} +

  test-matrix:
    name: Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        bits: [64]
        include:
          - os: ubuntu-latest
            bits: 32
    runs-on: ${{ matrix.os }}
    steps:
      - if: matrix.bits == 32
        run: echo 'CARGO_BUILD_TARGET=i686-unknown-linux-gnu' >> $GITHUB_ENV

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # Also include a list of recent commits, to regenerate missing live output.
          fetch-depth: 100
      - if: startsWith(matrix.os, 'ubuntu-') && matrix.bits == 32
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y gcc-multilib g++-multilib libssl-dev:i386 pkg-config:i386
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          targets: ${{ matrix.bits == 32 && 'i686-unknown-linux-gnu' || '' }}
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: ${{ matrix.bits }}
      - run: cargo test --workspace --no-run
      - run: cargo test --workspace --no-fail-fast
        env:
          # Only generate annotations from one matrix configuration.
          USE_GITHUB_ANNOTATIONS: ${{ startsWith(matrix.os, 'ubuntu-') && matrix.bits == 64 }}

      - name: Generate missing live output and regenerate the test report
        if: always()
        run: cargo testit regen --rerun ${{ (job.status == 'success' && github.event_name == 'pull_request') && format('--base-revision={0}', github.event.pull_request.base.sha) || '' }}

      - name: Upload test store
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tests-store-${{ matrix.os }}-${{ matrix.bits }}
          path: |
            tests/store/by-hash
            tests/store/render
            tests/store/pdftags
            tests/store/html
          compression-level: 9
          retention-days: 7

      - name: Upload test report
        # When the CI passes, only upload one test report, since all should be the same.
        if: failure() || (success() && github.event_name == 'pull_request' && startsWith(matrix.os, 'ubuntu-') && matrix.bits == 64)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tests-report-${{ matrix.os }}-${{ matrix.bits }}
          path: tests/store/report.html
          compression-level: 9

  checks:
    name: Check clippy, formatting, and crate docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --no-default-features
      - run: cargo fmt --check --all
      - run: cargo doc --workspace --no-deps --document-private-items
      - run: git diff --exit-code

  docs:
    name: Check documentation (website and PDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - run: cargo docit compile --format website --deny-warnings
      - run: cargo docit compile --format pdf --deny-warnings

  min-version:
    name: Check minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@87eb139fed4b08a67bd1fa429a21d1f5d523e03e # 1.92.0
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - run: cargo check --workspace

  fuzz:
    name: Check fuzzers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2025-10-28
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - run: cargo install --locked cargo-fuzz@0.12.0
      - run: cd tests/fuzz && cargo fuzz build --dev

  miri:
    name: Check unsafe code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          components: miri
          toolchain: nightly-2025-10-28
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - run: cargo miri test -p typst-library test_miri
